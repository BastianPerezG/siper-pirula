<!DOCTYPE html>

            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        pirula: {
                            dark: '#2C1810',
                            brown: '#5D4037',
                            amber: '#FFB300',
                            cream: '#F5F5DC',
