<h1>Productos del proveedor {{ proveedor.nombre }}</h1>

<a href="{% url 'producto_create' proveedor.id %}">Agregar producto</a>

<table border="1">
    <tr>
        <th>Producto</th>
        <th>SKU</th>
        <th>Stock</th>
        <th>Costo</th>
        <th>Acciones</th>
    </tr>

    {% for prod in productos %}
    <tr {% if prod.bajo_stock %}style="background-color:#ffcccc"{% endif %}>
        <td>{{ prod.nombre_producto }}</td>
        <td>{{ prod.sku_interno }}</td>
        <td>{{ prod.stock_actual }}</td>
        <td>{{ prod.precio_costo }}</td>
        <td>
            <a href="{% url 'producto_edit' prod.id %}">Editar</a> |
            <a href="{% url 'producto_ocultar' prod.id %}">Ocultar</a>
        </td>
    </tr>
    {% endfor %}
</table>
