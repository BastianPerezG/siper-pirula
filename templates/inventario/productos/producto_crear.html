{% extends "../../core/base.html" %}

{% block title %}Crear producto - SIPER Pirula{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold mb-4">Crear producto</h1>

<form method="post" class="space-y-6 max-w-3xl">
    {% csrf_token %}

    <div class="bg-white shadow-sm rounded-lg p-6 grid gap-4 md:grid-cols-2 text-sm">
        {{ form.as_p }}
    </div>

    <div class="flex gap-3">
        <button type="submit"
                class="px-4 py-2 rounded bg-emerald-600 text-white text-sm font-semibold hover:bg-emerald-700">
            Guardar
        </button>

        <a href="{% url 'inventario:scan_ean' %}"
           class="px-4 py-2 rounded border border-slate-300 text-sm hover:bg-slate-50">
            Cancelar
        </a>
    </div>
</form>
{% endblock %}
