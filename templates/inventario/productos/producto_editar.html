{# templates/inventario/producto_editar.html #}
<h1>Editar producto</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Guardar cambios</button>
</form>

<p>
    <a href="{% url 'inventario:producto_detalle' object.pk %}">Volver a la ficha</a> |
    <a href="{% url 'inventario:scan_ean' %}">Ir al lector</a>
</p>
