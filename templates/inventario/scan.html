{% extends "../core/base.html" %}

{% block title %}Escanear producto - SIPER Pirula{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6">

    <div>
        <h1 class="text-3xl font-bold text-slate-800">📷 Escanear producto</h1>
        <p class="text-slate-600 mt-1">Escanea o escribe el código de barras (EAN).</p>
    </div>

    <div class="bg-white p-6 rounded-xl shadow space-y-4">

        <form id="scan-form" method="get">
            <input
                type="text"
                name="ean"
                id="ean-input"
                autocomplete="off"
                autofocus
                placeholder="Escanea aquí..."
                class="w-full text-2xl p-3 border border-slate-300 rounded-lg focus:outline-none focus:ring focus:ring-amber-300"
            >
        </form>

        {% if ean %}
            <div class="bg-slate-100 p-4 rounded-lg text-sm">
                Último código leído:
                <span class="font-mono font-bold text-slate-800">{{ ean }}</span>
            </div>
        {% endif %}

    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const input = document.getElementById("ean-input");
    const form = document.getElementById("scan-form");

    window.addEventListener("load", () => input.focus());
    window.addEventListener("click", () => input.focus());

    input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
            e.preventDefault();
            form.submit();
        }
    });
</script>
{% endblock %}
