{% extends "core/base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white p-6 rounded shadow">
  <h1 class="text-xl font-bold mb-4">Ingreso trabajadores</h1>

  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <div class="space-y-4">
      {% for field in form %}
        <div>
          <label class="block text-sm font-medium mb-1">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}
            <p class="text-red-600 text-sm">{{ field.errors|striptags }}</p>
          {% endif %}
        </div>
      {% endfor %}
    </div>

    <button type="submit" class="mt-4 px-4 py-2 bg-sky-600 text-white rounded">
      Iniciar sesión
    </button>
  </form>
</div>
{% endblock %}
