{% extends "core/base.html" %}

{% block title %}Contraseña restablecida - El Gran Pirula{% endblock %}

{% block content_noauth %}
<div class="min-h-screen flex items-center justify-center -mt-16">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-2xl shadow-xl border border-pirula-cream overflow-hidden">
            <div class="bg-gradient-to-br from-pirula-dark to-pirula-medium p-8 text-center">
                <h1 class="text-2xl font-bold text-white">¡Todo listo!</h1>
            </div>

            <div class="p-8 text-center space-y-4">
                <div
                    class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                </div>

                <p class="text-pirula-dark text-sm leading-relaxed">
                    Tu contraseña ha sido restablecida exitosamente. Ya puedes ingresar con tus nuevas credenciales.
                </p>

                <div class="mt-8">
                    <a href="{% url 'core:login_interno' %}"
                        class="w-full inline-block px-6 py-3 rounded-lg bg-pirula-accent text-white font-bold text-sm hover:bg-pirula-light transition-colors shadow-md text-center">
                        🚀 Iniciar Sesión Ahora
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
