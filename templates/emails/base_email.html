<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
</head>

<body style="margin:0;padding:0;font-family:'Segoe UI',Arial,Helvetica,sans-serif;background-color:#f5f0e6;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f0e6;padding:32px 16px;">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0"
                    style="background-color:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 12px rgba(93,64,55,0.1);">
                    <!-- Header con gradiente -->
                    <tr>
                        <td
                            style="background:linear-gradient(135deg,#5d4037 0%,#8d6e63 100%);padding:24px;text-align:center;">
                            {% if logo_url %}
                            <img src="{{ logo_url }}" alt="El Gran Pirula" height="70"
                                style="display:block;margin:0 auto;border-radius:8px;">
                            {% else %}
                            <h1 style="color:#ffffff;margin:0;font-size:28px;font-weight:700;">🍷 El Gran Pirula</h1>
                            <p style="color:#d4c4b0;margin:4px 0 0 0;font-size:12px;">Botillería & Más</p>
                            {% endif %}
                        </td>
                    </tr>

                    <!-- Contenido principal -->
                    <tr>
                        <td style="padding:32px;">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="padding:20px 32px;background-color:#f5f0e6;border-top:2px solid #d4c4b0;">
                            <table width="100%" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td style="font-size:12px;color:#8d6e63;text-align:center;">
                                        <p style="margin:0 0 8px 0;">
                                            <strong style="color:#5d4037;">El Gran Pirula</strong> - Botillería & Más
                                        </p>
                                        <p style="margin:0;font-size:11px;color:#a1887f;">
                                            Este es un mensaje automático. Por favor, no respondas a este correo.
                                        </p>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>

                <!-- Link inferior -->
                <table width="600" cellpadding="0" cellspacing="0">
                    <tr>
                        <td style="padding:16px;text-align:center;">
                            <p style="margin:0;font-size:11px;color:#8d6e63;">
                                © 2024 El Gran Pirula - Sistema SIPER
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
