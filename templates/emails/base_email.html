<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;background-color:#f5f5f5;">
<table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f5f5;padding:24px 0;">
    <tr>
        <td align="center">
            <table width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;">
                <tr>
                    <td style="background-color:#1d1d1d;padding:16px 24px;" align="center">
                        <img src="{{ logo_url }}" alt="El Gran Pirula" height="64" style="display:block;">
                    </td>
                </tr>
                <tr>
                    <td style="padding:24px;">
                        {% block content %}{% endblock %}
                    </td>
                </tr>
                <tr>
                    <td style="padding:16px 24px;font-size:12px;color:#888888;border-top:1px solid #eeeeee;">
                        Este es un mensaje automático de <strong>El Gran Pirula</strong>. Por favor, no respondas a este correo.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
